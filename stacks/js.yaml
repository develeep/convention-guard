id: js
tags: [js]
detect:
  file: package.json
lint:
  - cmd: ["npx", "--no-install", "eslint", "--format=json", "{files}"]
    if_exists: node_modules/.bin/eslint
    files: ["**/*.{js,jsx,mjs,cjs,ts,tsx}"]
    parse: eslint-json
  - cmd: ["npx", "--no-install", "biome", "check", "--reporter=github", "{files}"]
    if_exists: node_modules/.bin/biome
    files: ["**/*.{js,jsx,mjs,cjs,ts,tsx,json,jsonc,css}"]
    parse: github
