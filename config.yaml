# convention-guard 플러그인 기본값.
# 레포에서는 <repo>/.claude/convention-guard/config.yaml 에 바꿀 키만 적으세요.
# 우선순위: 이 파일 < 설치 시 userConfig < 레포 config (팀 설정이 최종)

mode: report                 # report = 기록만 / fix = 차단하고 에이전트가 고침 / auto-fix = 안전한 규칙은 자동 수정
presets: auto                # auto = common + security + 감지된 스택 프리셋. 목록으로 고를 수도 있음: [auto, architecture]

stacks: []                   # 감지가 빗나갈 때만 강제 지정
disable: []                  # 끌 규칙 id — 이유를 주석으로 남기세요
severity: {}                 # 규칙별 강도 조정. 예) core/php-line-too-long: warn
exclude: []                  # 검사하지 않을 경로 글롭. 예) "legacy/**"
# generated: 빌드 산출물·생성 코드·lock·테스트처럼 어떤 규칙도 읽지 않는 경로 (기본 목록은
#   scripts/lib/config.py 의 GENERATED). 레포 config 에서 목록을 통째로 바꾸거나 [] 로 끕니다.

limits:
  max_error_rules: 4         # 한 번에 보여줄 error 규칙 수
  max_warn_rules: 3          # 차단할 때 함께 보낼 warn 규칙 수
  max_locations_per_rule: 3  # 규칙당 보여줄 위치 수
  max_consecutive_blocks: 3  # 한 요청 안의 연속 차단 상한 (무한 루프 방지). 새 요청이나 깨끗한 턴에서 초기화
  max_verify_attempts: 1     # 수정 후 재검증에서 남은/새 위반으로 다시 차단하는 횟수

linters:
  enabled: true              # 스택별 린터 위임 (변경된 줄에 걸린 것만 차단)
  timeout: 90                # 린터 명령 하나당 초

semantic_review:
  enabled: false             # 후보가 있을 때만 convention-reviewer 서브에이전트로 의미 판정
  max_candidates: 5          # 한 번에 판정 맡길 후보 수
  context_budget_lines: 400  # 한 배치의 컨텍스트 팩 줄 수 상한
  verdict_ttl_days: 30       # 코드가 그대로면 판정을 재사용하는 기간

skip_if_question: true       # 에이전트가 질문으로 턴을 끝내면 검사 생략
respect_supersede: true      # pint.json 등이 있으면 해당 포맷 규칙 비활성화
once_per_session: true       # 사이클에서 고쳐진 규칙은 세션 동안 다시 지적하지 않음 (기각은 예외, when_code_added 규칙은 해당 없음)
