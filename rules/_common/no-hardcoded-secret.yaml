id: no-hardcoded-secret
title: 시크릿 하드코딩 금지
severity: error
applies_to:
  stacks: ["*"]
  exclude: ["**/*.example", "**/*.sample", "**/*_test.*", "**/*.test.*", "**/tests/**", "**/fixtures/**"]
detect:
  when_line_added: '(?i)\b(api[_-]?key|secret[_-]?key|access[_-]?token|client[_-]?secret|password)\b\s*[:=]\s*["''][^"''$\{<]{8,}["'']'
message: |
  자격증명을 코드에 직접 넣지 마세요. 환경변수나 시크릿 매니저에서 읽어 주입합니다.
tests:
  match:
    - 'const apiKey = "sk-live-9f2b41c8aa";'
    - '$password = ''p@ssw0rd-prod-1'';'
  no_match:
    - 'const apiKey = process.env.API_KEY;'
    - 'password: ${DB_PASSWORD}'
    - 'api_key: ""'
