id: no-hardcoded-secret
title: 시크릿 하드코딩 금지
severity: error
applies_to:
  stacks: ["*"]
  exclude: ["**/*.example", "**/*.sample", "**/*_test.*", "**/*.test.*", "**/tests/**", "**/fixtures/**"]
detect:
  when_line_added: '(?i)\b(api[_-]?key|secret[_-]?key|access[_-]?token|client[_-]?secret|password)\b\s*[:=]\s*["''][^"''$\{<]{8,}["'']'
  # 시크릿은 문자열 리터럴 *안에* 있습니다. string 을 넣으면 규칙이 죽습니다.
  not_in: [comment]
message: |
  자격증명을 코드에 직접 넣지 마세요. 환경변수나 시크릿 매니저에서 읽어 주입합니다.
tests:
  # 이 규칙은 파일 글롭이 없어 픽스처 언어를 추론할 수 없습니다
  lang: js
  match:
    - 'const apiKey = "sk-live-9f2b41c8aa";'
    - '$password = ''p@ssw0rd-prod-1'';'
  no_match:
    - 'const apiKey = process.env.API_KEY;'
    - 'password: ${DB_PASSWORD}'
    - 'api_key: ""'
    # 3.0 구조 조건: 주석·문자열 안의 매치는 위반이 아닙니다
    - |
      function boot() {
          // const api_key = "sk-live-0000111122223333";
          return null;
      }
