id: domain-purity
title: 도메인 계층의 I/O·인프라 의존
severity: error
prevent: 도메인 계층(Domain/)은 DB·HTTP·파일·환경 변수에 직접 의존하지 마세요. Domain 안에 인터페이스(포트)를 두고 구현은 바깥 계층에 둡니다.
applies_to:
  stacks: ["*"]
  files:
    - "**/Domain/**/*.{php,ts,tsx,js,py}"
    - "**/domain/**/*.{php,ts,tsx,js,py}"
  exclude:
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/test_*.py"
    - "**/tests/**"
detect:
  # 정규식 신호가 없는 컨벤션: import 이름에 infra·db 가 없어도 의존은 의존입니다.
  # 이 파일들에 에이전트가 코드를 추가하면 판정 단위마다 리뷰어가 판정합니다 (units.py)
  when_code_added: true
semantic_review:
  context: [imports]
  max_context_lines: 120
  instruction: |
    질문은 하나입니다: 이 판정 단위가 도메인 계층을 I/O 나 인프라 구현에 의존하게 만드는가?
    VIOLATION: 단위의 코드가 다음 중 하나를 import 하거나, 주입받거나, 직접 호출한다.
      DB(쿼리 빌더, ORM 모델 조회·저장), HTTP 클라이언트, 파일·큐·캐시·메일, 환경 변수·설정 읽기,
      또는 도메인 디렉터리 밖의 구체 클래스 중 위 I/O 를 하는 것.
    VALID: 순수 계산, 값 객체·엔티티 조작, 도메인 예외, 도메인 안의 인터페이스(포트)를 통한 호출,
      I/O 와 무관한 namespace·import·클래스 선언.
    import 경로만으로 의존 대상이 I/O 를 하는지 알 수 없으면 그 파일을 Read 로 한 번만 확인합니다.
    이 규칙 외의 문제는 판정하지 않습니다. 판단이 서지 않으면 VALID 입니다.
message: |
  도메인 계층이 I/O·인프라에 직접 의존합니다. 도메인 안에 인터페이스(포트)를 두고
  구현은 바깥 계층(Infrastructure 등)에 두세요.
tests:
  match:
    - "        return DB::table('orders')->count();"
  no_match:
    - "    }"
