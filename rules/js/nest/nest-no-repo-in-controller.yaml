id: nest-no-repo-in-controller
title: 컨트롤러에서 레포지토리 직접 주입
severity: warn
applies_to:
  stack: [nest]
  files: ["**/*.controller.ts"]
triggers:
  code_regex: '(Repository<|@InjectRepository|getRepository\s*\()'
context_injection: |
  컨트롤러는 HTTP 경계만 담당합니다. 데이터 접근은 서비스 계층을 통해 가세요.
tests:
  should_match:
    - '    private readonly repo: Repository<User>,'
  should_not_match:
    - '    private readonly users: UserService,'
