id: nest-no-raw-req-res
title: 컨트롤러에서 @Req/@Res 직접 사용
severity: warn
applies_to:
  stacks: [nest]
  files: ["**/*.controller.ts"]
detect:
  when_line_added: '@(Req|Res|Response|Request)\s*\(\s*\)'
message: |
  플랫폼 객체를 직접 다루면 인터셉터와 예외 필터가 동작하지 않습니다.
  DTO 와 반환값으로 처리하세요.
tests:
  match:
    - '  findAll(@Res() res: Response) {'
  no_match:
    - '  findAll(@Query() query: ListDto) {'
