id: next-no-public-secret
title: NEXT_PUBLIC_ 에 시크릿 노출 금지
severity: error
applies_to:
  stack: [next]
triggers:
  code_regex: 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|TOKEN|PASSWORD|PRIVATE|_KEY)'
context_injection: |
  NEXT_PUBLIC_ 변수는 브라우저 번들에 그대로 들어갑니다.
  서버 전용 값이면 접두사를 떼고 서버 컴포넌트나 route handler 에서만 읽으세요.
tests:
  should_match:
    - 'process.env.NEXT_PUBLIC_STRIPE_SECRET'
  should_not_match:
    - 'process.env.NEXT_PUBLIC_API_URL'
    - 'process.env.STRIPE_SECRET'
