id: js-no-empty-catch
title: 빈 catch 블록 금지
severity: warn
applies_to:
  stacks: [js]
  files: ["**/*.{ts,tsx,js,jsx,mjs}"]
  exclude: ["**/node_modules/**", "**/*.test.*", "**/*.spec.*"]
detect:
  # 빈 여부는 정규식이 아니라 구조가 판정합니다 — 주석은 내용으로 봅니다.
  file_regex: 'catch\s*(\([^)]*\))?\s*\{'
  block_empty: true
message: |
  에러를 삼키지 마세요. 로거로 남기거나, 의도적으로 무시한다면 이유를 주석으로 남기세요.
tests:
  match:
    - "  } catch (e) {\n  }\n"
    - "  } catch {}\n"
  no_match:
    - "  } catch (e) {\n    logger.warn(e);\n  }\n"
    - "  } catch (e) {\n    // 파싱 실패는 기본값 사용\n  }\n"
