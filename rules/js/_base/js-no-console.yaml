id: js-no-console
title: console 잔여물
severity: warn
applies_to:
  stacks: [js]
  files: ["**/*.{ts,tsx,js,jsx,mjs}"]
  exclude: ["**/*.test.*", "**/*.spec.*", "**/scripts/**", "**/node_modules/**", "**/*.config.*"]
detect:
  when_line_added: '(?<![\w.])console\.(log|debug|dir)\s*\('
message: |
  디버그 로그가 남아 있습니다. 제거하거나 팀 로거로 교체하세요.
tests:
  match:
    - '  console.log(user);'
  no_match:
    - '  logger.debug(user);'
    - '  console.error(err);'
