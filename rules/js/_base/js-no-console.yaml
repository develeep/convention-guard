id: js-no-console
title: console 잔여물
severity: warn
applies_to:
  stack: [js]
  files: ["**/*.{ts,tsx,js,jsx,mjs}"]
  exclude: ["**/*.test.*", "**/*.spec.*", "**/scripts/**", "**/node_modules/**", "**/*.config.*"]
triggers:
  code_regex: '(?<![\w.])console\.(log|debug|dir)\s*\('
context_injection: |
  디버그 로그가 남아 있습니다. 제거하거나 팀 로거로 교체하세요.
tests:
  should_match:
    - '  console.log(user);'
  should_not_match:
    - '  logger.debug(user);'
    - '  console.error(err);'
