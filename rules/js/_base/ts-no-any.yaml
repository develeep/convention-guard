id: ts-no-any
title: 명시적 any 지양
severity: warn
applies_to:
  stacks: [ts]
  files: ["**/*.{ts,tsx}"]
  exclude: ["**/*.d.ts", "**/*.test.*", "**/*.spec.*", "**/node_modules/**"]
detect:
  when_line_added: ':\s*any(\[\])?\s*(?=[,;)=>\}]|$)'
  # 주석·문자열 안의 매치는 위반이 아닙니다 (3.0 구조 조건)
  not_in: [comment, string]
message: |
  any 는 타입 검사를 통째로 끕니다. 구체 타입이나 unknown + 좁히기를 쓰세요.
  불가피하면 왜 any 인지 주석을 남기세요.
tests:
  match:
    - 'function f(x: any) {'
    - 'const rows: any[] = [];'
  no_match:
    - 'const x: unknown = y;'
    - 'type Company = { name: string };'
    # 3.0 구조 조건: 주석·문자열 안의 매치는 위반이 아닙니다
    - |
      export function parse(input: string): string {
          // const cached: any = null;
          const doc = "payload: any;";
          return input + doc;
      }
