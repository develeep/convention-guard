id: php-line-too-long
title: 한 줄 120자 초과
severity: info
applies_to:
  stacks: [php]
  files: ["app/**/*.php", "src/**/*.php", "routes/**/*.php"]
  exclude: ["**/vendor/**", "**/migrations/**", "**/lang/**", "config/**"]
detect:
  when_line_added: '^.{121,}$'
message: |
  PSR-12 상한은 120자입니다(권장 80자). 체이닝이나 인자를 줄바꿈하세요.
  포맷터가 고쳐주지 않는 항목이라 사람이 끊어야 합니다.
tests:
  match:
    - '        $result = $this->repository->whereHas("orders", fn ($q) => $q->where("status", "paid"))->with(["user", "items"])->get();'
  no_match:
    - '        $result = $this->repository->get();'
