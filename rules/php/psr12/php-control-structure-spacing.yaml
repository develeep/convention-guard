id: php-control-structure-spacing
title: 제어 구조 키워드와 괄호 공백
severity: warn
superseded_by: [pint.json, .php-cs-fixer.php, .php-cs-fixer.dist.php]
applies_to:
  stacks: [php]
  files: ["**/*.php"]
  exclude: ["**/vendor/**"]
detect:
  when_line_added: '(?<![\w$>])(if|elseif|for|foreach|while|switch|catch)(\(|\s\(\s|\s{2,}\()'
message: |
  키워드 뒤에 공백 하나, 여는 괄호 뒤에는 공백이 없어야 합니다.
  예) if ($expr) { ... }
tests:
  match:
    - '        if($a === $b) {'
    - '        foreach ( $rows as $row ) {'
  no_match:
    - '        if ($a === $b) {'
    - '        $this->if($a);'
