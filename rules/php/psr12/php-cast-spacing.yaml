id: php-cast-spacing
title: 형 변환 괄호 안 공백 금지
severity: warn
superseded_by: [pint.json, .php-cs-fixer.php, .php-cs-fixer.dist.php]
applies_to:
  stacks: [php]
  files: ["**/*.php"]
  exclude: ["**/vendor/**"]
detect:
  when_line_added: '\(\s+(int|integer|float|double|string|bool|boolean|array|object)\s*\)|\((int|integer|float|double|string|bool|boolean|array|object)\s+\)'
message: |
  캐스트 괄호 안에는 공백이 없어야 합니다. 예) $intValue = (int) $input;
fix:
  # 포맷터가 없는 레포에서 mode: auto-fix 일 때 추가된 줄에만 적용됩니다
  auto:
    replace: '\(\s*(int|integer|float|double|string|bool|boolean|array|object)\s*\)'
    with: '(\1)'
tests:
  match:
    - '$intValue = ( int )$input;'
    - '$intValue = (int )$input;'
  no_match:
    - '$intValue = (int) $input;'
    - 'function f(int $a)'
