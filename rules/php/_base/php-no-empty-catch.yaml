id: php-no-empty-catch
title: 빈 catch 블록 금지
severity: warn
applies_to:
  stacks: [php]
  files: ["**/*.php"]
  exclude: ["**/vendor/**"]
detect:
  file_regex: 'catch\s*\([^)]*\)\s*\{\s*\}'
message: |
  예외를 삼키지 마세요. 최소한 로그를 남기거나, 의도적으로 무시한다면
  이유를 주석으로 남기세요 (주석이 있으면 이 규칙은 걸리지 않습니다).
tests:
  match:
    - "        } catch (\\Throwable $e) {\n        }\n"
    - "} catch (FirstThrowableType $e) {}"
  no_match:
    - "        } catch (\\Throwable $e) {\n            Log::warning($e);\n        }\n"
    - "        } catch (\\Throwable $e) {\n            // 캐시 미스는 무시\n        }\n"
