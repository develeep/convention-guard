id: laravel-no-request-all
title: 검증 없는 $request->all() 금지
severity: warn
applies_to:
  stacks: [laravel]
  files: ["app/**/*.php"]
  exclude: ["**/vendor/**"]
detect:
  when_line_added: '\$request->all\s*\(\s*\)'
message: |
  검증되지 않은 입력을 통째로 넘기면 mass assignment 위험이 있습니다.
  FormRequest 를 만들고 $request->validated() 를 쓰세요.
tests:
  match:
    - 'User::create($request->all());'
  no_match:
    - 'User::create($request->validated());'
