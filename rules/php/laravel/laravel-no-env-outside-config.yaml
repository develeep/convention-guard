id: laravel-no-env-outside-config
title: config 밖에서 env() 호출 금지
severity: error
applies_to:
  stacks: [laravel]
  files: ["app/**/*.php", "routes/**/*.php", "**/*.blade.php"]
  exclude: ["config/**", "**/vendor/**"]
detect:
  when_line_added: '(?<![\w$>:])env\s*\('
message: |
  config 캐시가 켜지면 config/ 밖의 env() 는 null 이 됩니다.
  config/*.php 에 키를 정의하고 config('...') 로 읽으세요.
tests:
  match:
    - "$key = env('STRIPE_KEY');"
  no_match:
    - "$key = config('services.stripe.key');"
    - "$this->env('x');"
