id: laravel-api-resource-response
title: 컨트롤러에서 response()->json() 직접 반환
severity: warn
applies_to:
  stack: [laravel]
  files: ["app/Http/Controllers/**/*.php"]
  exclude: ["**/vendor/**"]
triggers:
  code_regex: '^(?!\s*(?:\*|//|#))[^\n]*\breturn\s+response\s*\(\s*\)\s*->json\s*\('
context_injection: |
  응답 모양을 컨트롤러에서 직접 만들고 있습니다. 이 레포는 JsonResource 로 응답을 감싸는 쪽으로
  쓰고 있으니 FooResource 를 만들어 `return new FooResource($foo)` 또는
  `FooResource::collection($foos)` 로 반환하세요.
probe:
  conforming: '\bnew\s+\w*Resource\s*\(|\b\w*Resource(?:Collection)?::(?:collection|make)\s*\(|->toResource(?:Collection)?\s*\('
rationale: 응답 필드가 컨트롤러마다 손으로 조립되면 컬럼 하나 숨기는 일이 전수조사가 됩니다. Resource 에 모여 있으면 한 파일만 고칩니다.
tests:
  should_match:
    - "        return response()->json(['data' => $orders]);"
    - "        return response()->json($order->toArray(), 201);"
  should_not_match:
    - "        return OrderResource::collection($orders);"
    - "        return new OrderResource($order);"
    - "        // 예전 코드는 return response()->json 으로 내려줬습니다"
    - "        return response()->noContent();"
