id: php-method-return-type
title: 메서드에 반환 타입 선언 없음
severity: warn
applies_to:
  stack: [php]
  files: ["app/**/*.php", "src/**/*.php"]
  exclude: ["**/vendor/**"]
triggers:
  code_regex: '^\s*(?:final\s+|abstract\s+)?(?:public|protected|private)(?:\s+static)?\s+function\s+(?!__construct\b|__destruct\b)\w+\s*\([^()]*\)\s*(?:\{|;)?\s*$'
context_injection: |
  메서드 시그니처에 반환 타입이 없습니다. 이 레포는 반환 타입을 붙이는 쪽으로
  쓰고 있으니 `: void`, `: JsonResponse` 처럼 명시하세요. 배열이면 최소한 `: array` 까지는 적으세요.
probe:
  conforming: 'function\s+\w+\s*\([^()]*\)\s*:\s*[?\\\w]'
rationale: 반환 타입은 정적 분석이 호출 측 실수를 잡아주는 최소 조건입니다. 절반만 붙어 있으면 phpstan 이 아무것도 못 잡습니다.
tests:
  should_match:
    - '    public function index()'
    - "    public function store(Request $request)\n    {"
    - '    private function cacheKey(string $name)'
  should_not_match:
    - '    public function index(): JsonResponse'
    - '    private function cacheKey(string $name): string'
    - '    public function __construct(private OrderService $orders)'
    - '     * public function index() 처럼 반환 타입을 빼지 마세요'
