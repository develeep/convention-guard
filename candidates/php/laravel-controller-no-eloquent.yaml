id: laravel-controller-no-eloquent
title: 컨트롤러에서 Eloquent 직접 호출 금지
severity: warn
applies_to:
  stack: [laravel]
  files: ["app/Http/Controllers/**/*.php"]
  exclude: ["**/vendor/**"]
triggers:
  code_regex: '\b[A-Z]\w+::(where|find|findOrFail|create|updateOrCreate|firstOrCreate|all)\s*\('
context_injection: |
  컨트롤러에서 모델을 직접 조회하고 있습니다. 이 레포는 조회를 서비스·리포지터리에
  두는 쪽으로 쓰고 있으니 그쪽을 거치세요.
probe:
  conforming: '\$this->\w*(Service|Repository|Repo|Action|UseCase|service|repository|repo|action)\w*->'
rationale: 조회가 컨트롤러에 퍼지면 재사용도 테스트도 안 됩니다. 계층이 이미 있는 레포에서만 값어치가 있습니다.
tests:
  should_match:
    - '        $orders = Order::where("user_id", $id)->get();'
    - '        $user = User::findOrFail($id);'
  should_not_match:
    - '        $orders = $this->orderService->forUser($id);'
    - '        $orders = $this->repo->paginate();'
    - '        Log::info("Order::where 를 쓰지 마세요");'
