id: laravel-test-status-helpers
title: assertStatus(200) 대신 상태 헬퍼 쓰기
severity: warn
applies_to:
  stack: [laravel]
  files: ["tests/**/*.php"]
  exclude: ["**/vendor/**"]
triggers:
  code_regex: '^(?!\s*(?:\*|//|#))[^\n]*->assertStatus\s*\(\s*(?:200|201|204|301|302|401|403|404|422|500)\s*\)'
context_injection: |
  숫자 상태 코드를 그대로 단정하고 있습니다. 이 레포는 이름 있는 헬퍼를 쓰는 쪽이니
  assertOk() / assertCreated() / assertNoContent() / assertForbidden() / assertNotFound() /
  assertUnprocessable() 로 바꾸세요. 헬퍼가 없는 코드(418 등)는 assertStatus 그대로 둡니다.
probe:
  conforming: '->assert(?:Ok|Created|Accepted|NoContent|Redirect|Unauthorized|Forbidden|NotFound|Unprocessable|ServerError)\w*\s*\('
rationale: 테스트는 실패했을 때 읽히는 게 전부입니다. assertOk 는 무엇을 기대했는지 그대로 말하고, 200 은 읽는 사람이 번역해야 합니다.
tests:
  should_match:
    - '        $response->assertStatus(200);'
    - "        $this->getJson('/api/orders')->assertStatus(422);"
  should_not_match:
    - '        $response->assertOk();'
    - '        $response->assertStatus(418);'
    - '        // assertStatus(200) 은 assertOk() 로 바꿨습니다'
    - '        $response->assertUnprocessable();'
