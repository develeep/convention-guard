id: laravel-constructor-promotion
title: 구식 생성자 할당 (프로퍼티 프로모션 미사용)
severity: warn
applies_to:
  stack: [laravel]
  files: ["app/**/*.php"]
  exclude: ["**/vendor/**"]
triggers:
  when_line_added: '^(?!\s*(?:\*|//|#))[^\n]*function\s+__construct\s*\(\s*[^)\s]'
  must_contain_in_file: '__construct\s*\([^)]*\b(?:private|protected|public|readonly)\s+[?\\\w|]+\s+\$'
context_injection: |
  인자를 받는 생성자를 추가했는데 이 파일에는 프로퍼티 프로모션이 없습니다.
  이 레포는 `__construct(private readonly FooRepository $foos)` 처럼 생성자에서 바로
  프로퍼티를 선언하는 쪽으로 쓰고 있으니 프로퍼티 선언 + `$this->x = $x` 3줄을 만들지 마세요.
probe:
  conforming: '__construct\s*\([^)]*\b(?:private|protected|public|readonly)\s+[?\\\w|]+\s+\$'
rationale: 선언·인자·할당 세 군데에 같은 이름을 적어 두면 한 곳만 고치는 실수가 생깁니다. PHP 8 이상에서는 한 줄로 끝납니다.
tests:
  should_match:
    - "class OrderService\n{\n    private OrderRepository $orders;\n\n    public function __construct(OrderRepository $orders)\n    {\n        $this->orders = $orders;\n    }\n}"
    - "class Mailer\n{\n    public function __construct(Transport $transport, Logger $logger)\n    {\n        $this->transport = $transport;\n        $this->logger = $logger;\n    }\n}"
  should_not_match:
    - "class OrderService\n{\n    public function __construct(private readonly OrderRepository $orders)\n    {\n    }\n}"
    - "class OrderService\n{\n    public function __construct(\n        private OrderRepository $orders,\n        private Clock $clock,\n    ) {\n    }\n}"
    - "class PlainValue\n{\n    public function __construct()\n    {\n    }\n}"
    - "class OrderService\n{\n    // public function __construct(OrderRepository $orders) 는 구식입니다\n    public function handle(): void\n    {\n    }\n}"
