id: go-test-assert-lib
title: 테스트 단정은 require/assert 로
severity: warn
applies_to:
  stack: [go]
  files: ["**/*_test.go"]
  exclude: ["**/vendor/**", "**/testdata/**"]
triggers:
  code_regex: '^(?:[^/"`\n]|/(?![/*])|"[^"\n]*"|`[^`\n]*`)*?\bt\.(?:Errorf|Error|Fatalf|Fatal)\s*\('
context_injection: |
  t.Errorf / t.Fatal 로 직접 단정하고 있습니다. 이 레포의 테스트는
  require.NoError(t, err) / assert.Equal(t, want, got) 관용을 쓰고 있으니
  그쪽에 맞추세요. 실패 메시지 형식이 테스트마다 달라지지 않습니다.
probe:
  conforming: '\b(?:require|assert)\.[A-Z]\w*\(\s*t\b'
rationale: 단정 방식이 파일마다 다르면 실패 출력을 읽는 법도 파일마다 달라집니다. 라이브러리를 이미 쓰는 레포에서만 값어치가 있습니다.
tests:
  should_match:
    - '		t.Errorf("want %d, got %d", want, got)'
    - '		t.Fatal(err)'
    - '		t.Fatalf("setup: %v", err)'
  should_not_match:
    - '	require.NoError(t, err)'
    - '	assert.Equal(t, 200, rec.Code)'
    - '	// t.Errorf 대신 require 를 쓰세요'
    - '	require.Equal(t, "t.Fatal(err)", line)'
    - '	t.Helper()'
