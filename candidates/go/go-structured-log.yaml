id: go-structured-log
title: 표준 log 대신 구조화 로거 사용
severity: warn
applies_to:
  stack: [go]
  files: ["**/*.go"]
  exclude: ["**/vendor/**", "**/*_test.go", "**/main.go", "cmd/**", "**/*.pb.go"]
triggers:
  code_regex: '^(?:[^/"`\n]|/(?![/*])|"[^"\n]*"|`[^`\n]*`)*?\blog\.(?:Print|Printf|Println|Fatal|Fatalf|Fatalln)\s*\('
context_injection: |
  표준 log 패키지로 찍고 있습니다. 이 레포는 구조화 로거(slog/zap/zerolog)로
  키-값을 붙여 남기는 쪽으로 쓰고 있으니 그쪽에 맞추세요.
  종료가 필요한 초기화 실패는 main 이나 cmd/ 에서 처리합니다.
probe:
  conforming: '(\b(?:slog|zap|zerolog|logrus)\.\w+|\b(?:log|logger|l)\.(?:Info|Warn|Error|Debug|With)\()'
rationale: 문장으로 찍은 로그는 검색·집계가 안 됩니다. 로거를 절반만 바꾼 레포가 제일 나쁩니다.
tests:
  should_match:
    - '	log.Printf("user %d not found", id)'
    - '	log.Println("cache warmed")'
    - '		log.Fatalf("cannot listen: %v", err)'
  should_not_match:
    - '	slog.Info("cache warmed", "size", n)'
    - '	logger.Error("request failed", "err", err)'
    - '	// log.Println 대신 slog.Info 를 쓰세요'
    - '	slog.Warn("log.Printf 는 금지", "rule", id)'
    - '	fmt.Println("hello")'
