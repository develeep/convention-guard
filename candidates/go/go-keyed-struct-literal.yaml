id: go-keyed-struct-literal
title: 구조체 리터럴은 필드명을 붙여 초기화
severity: warn
applies_to:
  stack: [go]
  files: ["**/*.go"]
  exclude: ["**/vendor/**", "**/*_test.go", "**/*.pb.go", "**/mock_*.go", "**/*_mock.go"]
triggers:
  code_regex: '^(?:[^/"`\n]|/(?![/*])|"[^"\n]*"|`[^`\n]*`)*?(?<![\]\w.])[A-Z]\w*\{\s*(?:"[^"]*"|`[^`]*`|-?\d+(?:\.\d+)?|&?[a-z_]\w*(?:\([^()]*\))?)\s*(?:,|\}\s*[,;)]*\s*$)'
context_injection: |
  구조체 리터럴에 필드명이 없습니다. 이 레포는 T{A: 1, B: 2} 처럼 필드명을 붙여
  초기화하는 쪽으로 쓰고 있으니 그쪽에 맞추세요. 필드가 추가되거나 순서가 바뀌어도
  조용히 깨지지 않는 유일한 방법입니다.
probe:
  conforming: '\b[A-Z]\w*\{\s*[A-Za-z_]\w*\s*:'
rationale: 필드 순서에 의존한 초기화는 필드가 하나 끼어드는 순간 조용히 다른 값이 들어갑니다. 같은 패키지 타입은 go vet composites 가 잡아주지 않으니 이 규칙 몫입니다.
tests:
  should_match:
    - '	p := Point{1, 2}'
    - '	return &Response{200, "ok"}'
    - '	cfg := Options{true, 30}'
  should_not_match:
    - '	p := Point{X: 1, Y: 2}'
    - '	return &Response{Status: 200, Body: "ok"}'
    - '	// Point{1, 2} 처럼 쓰지 말고 필드명을 붙이세요'
    - '	log.Printf("Point{1, 2} 형태는 금지")'
    - '	vals := []string{"a", "b"}'
    - '	client := http.Client{Timeout: 5 * time.Second}'
