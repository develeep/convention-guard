id: go-any-over-interface
title: interface{} 대신 any
severity: warn
applies_to:
  stack: [go]
  version: ">=1.18"
  files: ["**/*.go"]
  exclude: ["**/vendor/**", "**/*.pb.go", "**/*_gen.go"]
triggers:
  code_regex: '^(?:[^/"`\n]|/(?![/*])|"[^"\n]*"|`[^`\n]*`)*?\binterface\{\s*\}'
context_injection: |
  interface{} 를 쓰고 있습니다. 이 레포는 Go 1.18 이후 별칭인 any 로 통일해서
  쓰고 있으니 any 로 맞추세요.
probe:
  conforming: '(?:\.\.\.any\b|\[\]any\b|\]any\b|\bany\s*[,)\]]|\bany\s*$)'
rationale: 같은 타입을 두 가지로 적으면 검색과 리뷰가 둘 다 새어나갑니다. 표기 하나로 모으는 값어치만 있는 규칙입니다.
tests:
  should_match:
    - 'func Handle(v interface{}) error {'
    - '	var payload map[string]interface{}'
    - '	cache := make(map[string]interface{}, 8)'
  should_not_match:
    - 'func Handle(v any) error {'
    - '	var payload map[string]any'
    - '	// interface{} 대신 any 를 쓰세요'
    - '	return fmt.Errorf("interface{} 금지: %s", name)'
    - 'type Store interface {'
