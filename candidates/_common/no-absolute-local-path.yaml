id: no-absolute-local-path
title: 절대 경로 하드코딩 금지
severity: warn
applies_to:
  stack: ["*"]
  files: ["**/*.{go,ts,tsx,js,jsx,mjs,cjs,php,py,rb,java,kt,cs,rs}"]
  exclude:
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.next/**"
    - "**/testdata/**"
    - "**/tests/**"
    - "**/test/**"
    - "**/fixtures/**"
    - "**/*_test.go"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*Test.php"
    - "**/migrations/**"
    - "**/lang/**"
    - "**/locales/**"
    - "**/i18n/**"
    - "**/*.min.js"
    - "**/*.pb.go"
    - "**/*.generated.*"
    - "**/*.example.*"
triggers:
  code_regex: '^(?![ \t]*(?://|#|\*|/\*|--|;))[^\n]*?["''`](?:/(?:Users|home)/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+|/(?:var|opt|srv)/[A-Za-z0-9._-]+/|[A-Za-z]:\\)'
context_injection: |
  절대 경로를 코드에 박고 있습니다. 이 레포는 기준 경로를 설정·환경변수에서 받고
  거기에 경로를 조립하는 쪽으로 쓰고 있으니(filepath.Join, path.join, __DIR__ 등)
  그쪽에 맞추세요.
probe:
  conforming: '(?:filepath\.Join\(|path\.join\(|os\.path\.join\(|Path\.Combine\(|__DIR__|Paths\.get\(|path\.resolve\()'
rationale: 남의 기계와 컨테이너에서 존재하지 않는 경로는 실행 직전까지 아무도 모릅니다.
tests:
  should_match:
    - '	cachePath := "/home/deploy/app/cache"'
    - 'const LOG_FILE = "/Users/jane/work/app/app.log";'
    - '	store := "/var/lib/app/uploads/"'
  should_not_match:
    - '	cachePath := filepath.Join(root, "cache")'
    - "$path = __DIR__ . '/../storage/cache';"
    - '	log.Println("moved from /home/deploy to the new root")'
    - '# /home/deploy 아래에 두세요'
    - '	href := "/home/dashboard"'
