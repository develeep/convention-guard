id: no-localhost-endpoint
title: 로컬 주소·포트 하드코딩 금지
severity: warn
applies_to:
  stack: ["*"]
  files: ["**/*.{go,ts,tsx,js,jsx,mjs,cjs,php,py,rb,java,kt,cs,rs}"]
  exclude:
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.next/**"
    - "**/testdata/**"
    - "**/tests/**"
    - "**/test/**"
    - "**/fixtures/**"
    - "**/*_test.go"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*Test.php"
    - "**/migrations/**"
    - "**/lang/**"
    - "**/locales/**"
    - "**/i18n/**"
    - "**/*.min.js"
    - "**/*.pb.go"
    - "**/*.generated.*"
    - "**/*.example.*"
triggers:
  code_regex: '^(?![ \t]*(?://|#|\*|/\*|--|;))[^\n]*?[:=]>?\s*["''`]\s*(?:https?|wss?|redis|mongodb|postgres(?:ql)?|mysql|amqp)://(?:localhost|127\.0\.0\.1|0\.0\.0\.0|host\.docker\.internal)\b'
context_injection: |
  로컬 주소를 코드에 박고 있습니다. 이 레포는 접속 주소를 환경변수나 설정에서
  읽는 쪽으로 쓰고 있으니 그쪽을 거치세요. 기본값이 필요하면 설정 계층에 두세요.
probe:
  conforming: '(?:os\.(?:Getenv|LookupEnv)\(|process\.env\.|import\.meta\.env\.|\bgetenv\(|\bENV\[|os\.environ|System\.getenv\(|\benv\(["'']|\bflag\.\w+\()'
rationale: 내 노트북에서만 되는 주소는 배포에서 반드시 터지고, 터질 때는 설정이 아니라 코드를 고쳐야 합니다.
tests:
  should_match:
    - '	baseURL := "http://localhost:8080"'
    - 'const REDIS_URL = "redis://127.0.0.1:6379";'
    - "    'dsn' => 'postgres://localhost:5432/app',"
  should_not_match:
    - '	baseURL := os.Getenv("API_BASE_URL")'
    - 'const REDIS_URL = process.env.REDIS_URL;'
    - '// 개발 환경에서는 http://localhost:8080 으로 뜹니다'
    - '	log.Println("connecting to localhost")'
    - '  apiBase: config.apiBase,'
