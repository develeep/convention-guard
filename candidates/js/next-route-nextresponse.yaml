id: next-route-nextresponse
title: 라우트 핸들러 응답은 NextResponse 로
severity: warn
applies_to:
  stack: [next-app]
  files: ["app/**/route.{ts,tsx,js,jsx}", "src/app/**/route.{ts,tsx,js,jsx}"]
  exclude: ["**/node_modules/**"]
triggers:
  code_regex: '^(?!\s*(?://|\*)).*?(?<![\w.$])(?:new\s+Response\s*\(|Response\.json\s*\()'
context_injection: |
  원시 Response 로 응답을 만들고 있습니다. 이 레포의 라우트 핸들러는 `NextResponse.json`
  으로 응답하고 있으니 그쪽에 맞추세요. 헤더·쿠키·리다이렉트도 NextResponse 쪽 API 를 쓰세요.
probe:
  conforming: 'NextResponse\.(?:json|redirect|rewrite|next)\s*\('
rationale: 응답 생성이 한 곳으로 모이면 쿠키·헤더·리다이렉트를 붙이는 방법이 핸들러마다 갈리지 않고, 직렬화도 손으로 안 합니다.
tests:
  should_match:
    - '  return new Response(JSON.stringify(data), { status: 200 });'
    - '  return Response.json({ ok: true });'
  should_not_match:
    - '  return NextResponse.json({ items }, { status: 200 });'
    - '  return NextResponse.redirect(new URL("/login", req.url));'
    - '  // new Response(JSON.stringify(x)) 대신 NextResponse.json 을 쓰세요'
    - '  const note = "raw Response.json is banned here";'
