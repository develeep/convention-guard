id: ts-import-type-separate
title: 타입 import 는 import type 으로 분리
severity: warn
applies_to:
  stack: [ts]
  files: ["**/*.{ts,tsx}"]
  exclude: ["**/node_modules/**", "**/*.d.ts"]
triggers:
  code_regex: '^\s*import\s+\{[^}]*\btype\s+[A-Za-z_$]'
context_injection: |
  값 import 안에 인라인 `type` 을 섞었습니다. 이 레포는 타입을 `import type { ... }` 한 줄로
  따로 두는 쪽으로 쓰고 있으니 그쪽에 맞추세요.
probe:
  conforming: '^import\s+type\s+[\{A-Za-z_$*]'
rationale: 타입 import 가 한 줄로 분리돼 있으면 트랜스파일러가 그 줄을 통째로 지울 수 있고, 값·타입 경계가 읽는 사람에게도 보입니다.
tests:
  should_match:
    - 'import { type User, getUser } from "./user";'
    - 'import { useMemo, type ReactNode } from "react";'
  should_not_match:
    - 'import type { User } from "./user";'
    - 'import { getUser } from "./user";'
    - '// import { type User } from "./user" 말고 import type 를 쓰세요'
    - '  const doc = "import { type User } from ./user";'
