id: js-no-default-export
title: 모듈은 named export 로 내보내기
severity: warn
applies_to:
  stack: [js]
  files: ["src/**/*.{ts,tsx,js,jsx,mjs}", "lib/**/*.{ts,tsx,js,jsx,mjs}", "components/**/*.{ts,tsx,js,jsx}", "hooks/**/*.{ts,tsx,js,jsx}"]
  exclude:
    - "**/node_modules/**"
    - "**/*.d.ts"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*.config.*"
    - "**/app/**"
    - "**/pages/**"
triggers:
  code_regex: '^\s*export\s+default\b'
context_injection: |
  default export 를 쓰고 있습니다. 이 레포는 named export 로 내보내는 쪽으로 쓰고 있으니
  `export function Foo` / `export const foo` 형태로 맞추세요. 프레임워크가 default 를
  요구하는 파일(Next 의 page·layout 등)은 규칙 범위에서 빠져 있습니다.
probe:
  conforming: '^export\s+(?:async\s+function|function|const|let|var|class|abstract\s+class|interface|type|enum|\{)'
rationale: 이름이 하나로 고정되면 import 마다 다른 이름이 붙는 일이 없고, 자동 임포트와 전체 검색이 그대로 먹힙니다.
tests:
  should_match:
    - 'export default function UserCard({ user }: Props) {'
    - 'export default connect(mapState)(UserList);'
  should_not_match:
    - 'export function UserCard({ user }: Props) {'
    - 'export const userCard = () => null;'
    - '// export default 는 쓰지 않습니다 — named export 로 내보내세요'
    - '  const hint = "export default 금지";'
