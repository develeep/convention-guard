id: nest-constructor-injection
title: 의존성은 생성자 주입으로 받기
severity: warn
applies_to:
  stack: [nest]
  files: ["**/*.controller.ts", "**/*.service.ts", "**/*.resolver.ts", "**/*.gateway.ts"]
  exclude: ["**/node_modules/**", "**/*.spec.ts", "**/*.test.ts"]
triggers:
  code_regex: '^(?!\s*(?://|\*)).*?(?<![\w.$])new\s+[A-Z]\w*(?:Service|Repository|Client|Gateway|Facade|Manager)\s*\('
context_injection: |
  의존성을 `new` 로 직접 만들고 있습니다. 이 레포는 생성자 주입
  (`constructor(private readonly x: XService) {}`)으로 받고 있으니 그쪽에 맞추세요.
  직접 만든 인스턴스는 모듈 스코프도, 테스트에서의 교체도 받지 못합니다.
probe:
  conforming: 'constructor\s*\([^)]*\b(?:private|protected|public|readonly)\b'
rationale: 주입으로 받은 의존성만 모듈 설정과 테스트 더블이 통합니다. new 로 만든 것은 DI 컨테이너 밖이라 교체할 방법이 없습니다.
tests:
  should_match:
    - '    const mailer = new MailService(this.config);'
    - '    return new UserRepository(this.db).findAll();'
  should_not_match:
    - '    private readonly mailer: MailService,'
    - '    const dto = new CreateUserDto();'
    - '    // new MailService() 를 직접 만들지 말고 생성자 주입을 쓰세요'
