id: react-function-component
title: 클래스 컴포넌트 대신 함수 컴포넌트
severity: warn
applies_to:
  stack: [react]
  files: ["**/*.{tsx,jsx}"]
  exclude: ["**/node_modules/**", "**/*.test.*", "**/*.spec.*"]
triggers:
  code_regex: '^\s*(?:export\s+(?:default\s+)?)?(?:abstract\s+)?class\s+\w+\s+extends\s+(?:React\.)?(?:Pure)?Component\b'
context_injection: |
  클래스 컴포넌트를 새로 만들고 있습니다. 이 레포의 컴포넌트는 함수 + 훅으로 쓰고 있으니
  그쪽에 맞추세요. 에러 바운더리처럼 클래스가 불가피하면 왜 그런지 주석을 남기세요.
probe:
  conforming: '^\s*(?:export\s+(?:default\s+)?)?(?:async\s+)?function\s+[A-Z]\w*\s*\(|^\s*(?:export\s+)?const\s+[A-Z]\w*(?:\s*:\s*[^=\n]+)?\s*=\s*(?:\(|function\b|memo\b|forwardRef\b)'
rationale: 컴포넌트 모양이 한 가지면 상태·이펙트를 넣는 방법도 한 가지입니다. 클래스와 함수가 섞이면 훅을 쓸 수 있는 곳이 파일마다 달라집니다.
tests:
  should_match:
    - 'export default class UserCard extends React.Component<Props> {'
    - 'class LegacyList extends PureComponent {'
  should_not_match:
    - 'export function UserCard({ user }: Props) {'
    - 'export const UserList = ({ items }: Props) => ('
    - '// class Foo extends React.Component 형태는 더 쓰지 않습니다'
    - '  const doc = "class X extends Component";'
