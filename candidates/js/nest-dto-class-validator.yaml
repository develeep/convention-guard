id: nest-dto-class-validator
title: DTO 는 class-validator 로 검증하기
severity: warn
applies_to:
  stack: [nest]
  files: ["**/*.dto.ts", "**/dto/**/*.ts", "**/dtos/**/*.ts"]
  exclude: ["**/node_modules/**", "**/*.spec.ts", "**/*.test.ts"]
triggers:
  when_line_added: '^\s*export\s+class\s+\w*(?:Dto|DTO)\b'
  must_contain_in_file: '@(?:Is[A-Z]\w*|ValidateNested|Type|Min|Max|Length|Matches|Allow)\s*\('
context_injection: |
  검증 데코레이터가 없는 DTO 입니다. 이 레포의 DTO 는 class-validator 데코레이터
  (`@IsString()`, `@IsInt()`, `@IsOptional()` 등)로 필드를 검증하고 있으니 그쪽에 맞추세요.
  ValidationPipe 는 데코레이터가 없는 필드를 아예 검사하지 않습니다.
probe:
  conforming: '@(?:Is[A-Z]\w*|ValidateNested|Min|Max|Length|Matches)\s*\('
rationale: 검증이 DTO 에 붙어 있으면 요청 경계에서 한 번에 걸러지고, 서비스마다 같은 방어 코드를 다시 쓰지 않습니다.
tests:
  should_match:
    - "export class CreateUserDto {\n  name: string;\n  email: string;\n}\n"
    - "import { PartialType } from '@nestjs/mapped-types';\n\nexport class UpdateOrderDto {\n  status: string;\n}\n"
  should_not_match:
    - "import { IsEmail, IsString } from 'class-validator';\n\nexport class CreateUserDto {\n  @IsString()\n  name: string;\n\n  @IsEmail()\n  email: string;\n}\n"
    - "import { IsInt, IsOptional } from 'class-validator';\n\nexport class ListQueryDto {\n  @IsOptional()\n  @IsInt()\n  page?: number;\n}\n"
    - "// CreateUserDto 는 class-validator 데코레이터를 답니다\nexport class UserMapper {\n  toEntity(raw: CreateUserDto) {\n    return raw;\n  }\n}\n"
