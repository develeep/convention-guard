rule: core/next-client-hook-needs-directive
stacks: [js, react, next, next-app]
cases:
  - name: 진입점에 use client 없이 훅을 추가하면 걸림
    after:
      app/counter/page.tsx: |
        import { useState } from 'react';

        export default function Counter() {
          const [n, setN] = useState(0);
          return n;
        }
    expect: ["app/counter/page.tsx:4"]

  - name: use client 가 있으면 조용함
    after:
      app/counter/page.tsx: |
        'use client';

        import { useState } from 'react';

        export default function Counter() {
          const [n, setN] = useState(0);
          return n;
        }
    expect: []

  - name: layout 도 진입점이라 걸림
    after:
      app/shop/layout.tsx: |
        import { useEffect } from 'react';

        export default function Layout({ children }) {
          useEffect(() => {}, []);
          return children;
        }
    expect: ["app/shop/layout.tsx:4"]

  - name: 이미 훅을 쓰던 진입점에서 훅이 아닌 줄만 고치면 조용함
    before:
      app/legacy/page.tsx: |
        import { useState } from 'react';

        export default function Legacy() {
          const [n] = useState(0);
          return n;
        }
    after:
      app/legacy/page.tsx: |
        import { useState } from 'react';

        export default function Legacy() {
          const [n] = useState(0);
          return n + 1;
        }
    expect: []

  - name: 진입점이 아닌 리프 컴포넌트는 걸리지 않음 (부모가 경계일 수 있음)
    after:
      app/_components/Counter.tsx: |
        import { useState } from 'react';

        export default function Counter() {
          const [n, setN] = useState(0);
          return n;
        }
    expect: []
