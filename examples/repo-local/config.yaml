# 레포에 두는 파일: <repo>/.claude/convention-rules/config.yaml
# 로컬 커스터마이징의 90%는 이 파일 하나로 끝납니다.

# 감지가 빗나갈 때만 강제 지정 (보통은 비워둡니다)
stacks: []

# 이 레포에서는 끌 공통 규칙
disable:
  - core/js-no-console

# 강도만 조정 (error -> warn 으로 내리면 로그에 downgraded 로 남습니다)
severity:
  core/ts-no-any: info

# 레거시 디렉터리는 통째로 제외
exclude:
  - "legacy/**"
  - "app/Legacy/**"

# 동작 튜닝 (플러그인 기본값 덮어쓰기)
max_rules: 3
base_ref: auto
